<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claude Tokens</title>
<link rel="icon" href="widget.ico">
<style>
  :root {
    --bg-dark:#16110d;
    --bg-panel:#241c15;
    --line:#3a2f24;
    --accent:#e08a3e;
    --accent-deep:#c1440e;
    --green:#7fb069;
    --yellow:#e0b13e;
    --red:#d9534f;
    --text:#f0e6d6;
    --dim:#8a7a64;
    --mono:'Cascadia Code','JetBrains Mono',Consolas,ui-monospace,monospace;
  }
  * { box-sizing:border-box; }
  html,body {
    margin:0; padding:0; width:100vw; height:100vh; overflow:hidden;
    background:radial-gradient(circle at 30% 20%, #241c15 0%, var(--bg-dark) 60%, #0e0a07 100%);
    font-family:var(--mono); color:var(--text);
    user-select:none;
  }
  .shell {
    width:100%; height:100%;
    display:flex; flex-direction:column;
    padding:16px 18px 14px;
    gap:10px;
    position:relative; overflow:hidden;
  }
  .titlebar {
    display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid var(--line); padding-bottom:8px;
  }
  .titlebar .name { font-size:13px; letter-spacing:3px; color:var(--accent); }
  .titlebar .stamp { font-size:10px; color:var(--dim); }

  .topnav {
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:6px; margin-bottom:2px;
    border-bottom:1px solid var(--line);
    position:relative; z-index:2;
  }
  .topnav .btn-group { display:flex; align-items:center; gap:8px; }
  .pin-btn {
    background:none; border:1px solid var(--line); border-radius:6px;
    color:var(--dim); font-family:var(--mono); font-size:10px;
    letter-spacing:1.5px; padding:4px 9px; cursor:pointer;
    transition:all 0.2s ease;
  }
  .pin-btn:hover { border-color:var(--accent); color:var(--accent); }
  .pin-btn.pinned {
    color:var(--bg-dark); background:var(--accent); border-color:var(--accent);
  }

  .bg-drift {
    position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .bg-drift span {
    position:absolute; border-radius:50%; filter:blur(30px); opacity:0.35;
  }
  .bg-drift .blob1 {
    width:180px; height:180px; left:-40px; top:-30px;
    background:radial-gradient(circle, var(--accent), transparent 70%);
    animation:drift1 22s ease-in-out infinite;
  }
  .bg-drift .blob2 {
    width:140px; height:140px; right:-30px; bottom:10%;
    background:radial-gradient(circle, var(--accent-deep), transparent 70%);
    animation:drift2 26s ease-in-out infinite;
  }
  .bg-drift .blob3 {
    width:120px; height:120px; left:35%; bottom:-40px;
    background:radial-gradient(circle, var(--accent), transparent 70%);
    animation:drift3 19s ease-in-out infinite;
  }
  @keyframes drift1 {
    0%,100% { transform:translate(0,0) scale(1); }
    50% { transform:translate(30px,25px) scale(1.15); }
  }
  @keyframes drift2 {
    0%,100% { transform:translate(0,0) scale(1); }
    50% { transform:translate(-25px,-20px) scale(1.1); }
  }
  @keyframes drift3 {
    0%,100% { transform:translate(0,0) scale(1); }
    50% { transform:translate(20px,-15px) scale(1.2); }
  }
  .bg-drift .ember {
    width:4px; height:4px; background:var(--accent);
    opacity:0; animation:ember-rise 7s ease-in infinite;
  }
  .ember:nth-child(4) { left:20%; bottom:10%; animation-delay:0s; }
  .ember:nth-child(5) { left:50%; bottom:15%; animation-delay:2.3s; }
  .ember:nth-child(6) { left:75%; bottom:5%; animation-delay:4.6s; }
  @keyframes ember-rise {
    0% { opacity:0; transform:translateY(0); }
    15% { opacity:0.6; }
    85% { opacity:0.4; }
    100% { opacity:0; transform:translateY(-160px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg-drift span { animation:none !important; }
  }

  .gauges { flex:1; display:flex; flex-direction:column; justify-content:flex-start; gap:14px; position:relative; z-index:1; }
  .gauge { display:flex; flex-direction:column; gap:4px; }
  .gauge .row1 {
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:11px; letter-spacing:1.5px;
  }
  .gauge .label { color:var(--dim); }
  .gauge .pct { font-size:20px; font-weight:600; color:var(--text); }
  .bar {
    height:10px; border-radius:5px; background:#0e0a07;
    border:1px solid var(--line); overflow:hidden;
  }
  .fill {
    height:100%; width:0%;
    border-radius:5px;
    background:linear-gradient(90deg, var(--accent-deep), var(--accent));
    transition:width 0.7s cubic-bezier(0.16,1,0.3,1);
  }
  .fill.warn { background:linear-gradient(90deg, #b8860b, var(--yellow)); }
  .fill.hot  { background:linear-gradient(90deg, #8b2500, var(--red)); }
  .gauge .reset { font-size:9px; color:var(--dim); text-align:right; }

  .btn {
    height:50px; border-radius:25px; border:1px solid var(--accent);
    background:linear-gradient(135deg, var(--accent), var(--accent-deep));
    color:#1a1410; font-family:var(--mono); font-size:13px; font-weight:600;
    letter-spacing:3px; cursor:pointer;
    box-shadow:0 0 16px 2px rgba(224,138,62,0.35);
    animation:btn-breathe 3.2s ease-in-out infinite;
    transition:transform 0.12s ease, box-shadow 0.2s ease;
    position:relative; z-index:1;
  }
  @keyframes btn-breathe {
    0%,100% { box-shadow:0 0 16px 2px rgba(224,138,62,0.35); }
    50% { box-shadow:0 0 26px 6px rgba(224,138,62,0.6); }
  }
  .btn:hover { transform:scale(1.02); box-shadow:0 0 30px 8px rgba(224,138,62,0.65); }
  .btn:active { transform:scale(0.97); }
  .btn.loading { color:var(--dim); background:var(--bg-panel); animation:none; pointer-events:none; }
  .err { font-size:10px; color:var(--red); text-align:center; min-height:12px; position:relative; z-index:1; }

  .view {
    display:none; flex:1; min-height:0;
    flex-direction:column; gap:10px;
    position:relative; z-index:1;
  }
  .view.active { display:flex; }

  .stick-note {
    flex:1; min-height:0;
    display:flex; flex-direction:column;
    background:linear-gradient(160deg, #f9eeb0 0%, #f3dd82 70%, #eccf68 100%);
    border-radius:3px 3px 14px 3px;
    box-shadow:0 8px 22px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.4);
    transform:rotate(-0.8deg);
    padding:26px 14px 14px;
    position:relative;
  }
  .stick-note::before {
    content:""; position:absolute; top:-10px; left:50%;
    width:88px; height:22px; transform:translateX(-50%) rotate(1.5deg);
    background:rgba(240,230,214,0.35);
    border-left:1px dashed rgba(255,255,255,0.35);
    border-right:1px dashed rgba(255,255,255,0.35);
  }
  .stick-note::after {
    content:""; position:absolute; right:0; bottom:0;
    border-style:solid; border-width:0 0 22px 22px;
    border-color:transparent transparent rgba(0,0,0,0.18) transparent;
    border-bottom-right-radius:14px;
  }
  .stick-note .note-label {
    font-size:9px; letter-spacing:2px; color:#8a7326;
    font-family:var(--mono); margin-bottom:4px;
  }
  .stick-note textarea {
    flex:1; width:100%; min-height:0; resize:none;
    background:transparent; border:none; outline:none;
    color:#41320e;
    font-family:'Segoe Print','Comic Sans MS',cursive;
    font-size:15px; line-height:1.55;
    user-select:text;
  }
  .stick-note textarea::placeholder { color:#a68c3a; }
  .stick-note .mirror-dot {
    position:absolute; top:8px; right:12px;
    width:8px; height:8px; border-radius:50%;
    background:rgba(65,50,14,0.35); opacity:0.6;
    transition:background 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
  }
  .stick-note .mirror-dot.typing { background:var(--accent-deep); opacity:1; box-shadow:0 0 6px 1px rgba(193,68,14,0.6); }
  .stick-note .mirror-dot.saved { background:var(--green); opacity:1; box-shadow:0 0 6px 1px rgba(127,176,105,0.6); }
  .stick-note .gh-star {
    position:absolute; bottom:8px; right:10px;
    font-size:13px; color:#8a7326; opacity:0.75;
    animation:gh-spin 6s linear infinite;
    text-decoration:none; cursor:pointer;
  }
  @keyframes gh-spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="shell">
  <div class="topnav">
    <div class="btn-group">
      <button class="pin-btn" id="pinBtn" onclick="togglePin()">📌 HANG</button>
    </div>
    <div class="btn-group">
      <button class="pin-btn" id="viewClaudeBtn" onclick="setView('claude')">🤖 CLAUDE</button>
      <button class="pin-btn" id="viewStickBtn" onclick="setView('stick')">🗒 STICKY</button>
    </div>
  </div>
  <div class="bg-drift">
    <span class="blob1"></span><span class="blob2"></span><span class="blob3"></span>
    <span class="ember"></span><span class="ember"></span><span class="ember"></span>
  </div>
  <div class="view" id="claudeView">
    <div class="titlebar">
      <span class="name">CLAUDE USAGE</span>
      <span class="stamp" id="stamp">—</span>
    </div>
    <div class="gauges" id="gauges"></div>
    <div class="err" id="err"></div>
    <button class="btn" id="btn" onclick="pull()">⟳ &nbsp;CHECK NOW</button>
  </div>
  <div class="view" id="stickView">
    <div class="stick-note">
      <span class="note-label">STICKY NOTE</span>
      <span class="mirror-dot" id="mirrorDot" title="idle"></span>
      <textarea id="noteText" placeholder="jot something…" oninput="noteChanged()"></textarea>
      <a class="gh-star" href="https://github.com/cdowns78999/003030-widget-one-sticky-save" target="_blank" title="github: live">★</a>
    </div>
  </div>
</div>
<script>
function fmtReset(iso){
  if(!iso) return "";
  const d = new Date(iso), ms = d - Date.now();
  if(ms <= 0) return "resetting…";
  const h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000);
  return "resets in " + (h ? h+"h " : "") + m + "m";
}
function render(data){
  const g = document.getElementById("gauges");
  g.innerHTML = "";
  (data.limits || []).forEach(l=>{
    const cls = l.percent >= 90 ? "hot" : l.percent >= 70 ? "warn" : "";
    const el = document.createElement("div");
    el.className = "gauge";
    el.innerHTML =
      '<div class="row1"><span class="label">'+l.label+'</span>'+
      '<span class="pct">'+l.percent+'%</span></div>'+
      '<div class="bar"><div class="fill '+cls+'" style="width:0%"></div></div>'+
      '<div class="reset">'+fmtReset(l.resets_at)+'</div>';
    g.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.querySelector(".fill").style.width = Math.min(l.percent,100)+"%";
    }));
  });
  document.getElementById("stamp").textContent = "live @ " + data.fetched_at;
}
async function pull(){
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  btn.classList.add("loading"); btn.textContent = "FETCHING…"; err.textContent = "";
  try{
    const r = await fetch("/live");
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    render(data);
  }catch(e){
    err.textContent = "fetch failed: " + e.message;
  }
  btn.classList.remove("loading"); btn.textContent = "⟳  CHECK NOW";
}
pull();
setInterval(pull, 5*60*1000);

let pinned = false;
async function togglePin(){
  const btn = document.getElementById("pinBtn");
  const want = !pinned;
  try{
    const r = await fetch(want ? "/pin" : "/unpin", {method:"POST"});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    pinned = want;
    btn.textContent = pinned ? "📌 UNHANG" : "📌 HANG";
    btn.classList.toggle("pinned", pinned);
  }catch(e){
    document.getElementById("err").textContent = "pin failed: " + e.message;
  }
}

const VIEW_KEY = "claude-token-widget-view";
let view = localStorage.getItem(VIEW_KEY) === "stick" ? "stick" : "claude";
function setView(v){
  view = v === "stick" ? "stick" : "claude";
  localStorage.setItem(VIEW_KEY, view);
  document.getElementById("claudeView").classList.toggle("active", view === "claude");
  document.getElementById("stickView").classList.toggle("active", view === "stick");
  document.getElementById("viewClaudeBtn").classList.toggle("pinned", view === "claude");
  document.getElementById("viewStickBtn").classList.toggle("pinned", view === "stick");
}

const NOTE_KEY = "claude-token-widget-note";
const IDLE_BACKUP_MS = 2 * 60 * 1000;
let noteTimer = null, idleTimer = null, savedFlashTimer = null;

function setMirror(state){
  const dot = document.getElementById("mirrorDot");
  if(!dot) return;
  dot.classList.remove("typing","saved");
  if(state) dot.classList.add(state);
  dot.title = state === "typing" ? "typing…" : state === "saved" ? "backed up" : "idle";
}

async function saveNote(text, isBackupPing){
  localStorage.setItem(NOTE_KEY, text);
  try{
    const r = await fetch("/note", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text:text})
    });
    if(r.ok){
      setMirror("saved");
      clearTimeout(savedFlashTimer);
      savedFlashTimer = setTimeout(()=>setMirror(null), 1500);
    }
  }catch(e){ /* backend missing — localStorage already holds the mirror */ }
}

// pings and points: every keystroke "pings" (mirror dot lights, autosave debounces),
// and 2 minutes of no typing "points" back to a full backup save.
function noteChanged(){
  const text = document.getElementById("noteText").value;
  setMirror("typing");
  clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>saveNote(text), 500);
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>saveNote(document.getElementById("noteText").value, true), IDLE_BACKUP_MS);
}
async function loadNote(){
  let text = localStorage.getItem(NOTE_KEY) || "";
  try{
    const r = await fetch("/note");
    if(r.ok){
      const data = await r.json();
      if(typeof data.text === "string") text = data.text;
    }
  }catch(e){ /* backend missing — keep localStorage fallback */ }
  document.getElementById("noteText").value = text;
}
setView(view);
loadNote();
</script>
</body>
</html>
